<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#0A0E14"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C566A"/>
    </marker>
  </defs>
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#C9D1D9" text-anchor="middle">
    <rect x="60" y="40" width="150" height="36" rx="6" fill="#161B22" stroke="#7C3AED"/>
    <text x="135" y="63">AI Application</text>
    <line x1="135" y1="76" x2="135" y2="104" stroke="#4C566A" marker-end="url(#arrow)"/>

    <rect x="60" y="106" width="150" height="36" rx="6" fill="#161B22" stroke="#7C3AED"/>
    <text x="135" y="129">MCP Client</text>
    <line x1="210" y1="124" x2="278" y2="124" stroke="#4C566A" marker-end="url(#arrow)"/>

    <rect x="280" y="106" width="150" height="36" rx="6" fill="#161B22" stroke="#22D3EE"/>
    <text x="355" y="129">MCP Gateway</text>
    <text x="355" y="97" font-size="11" fill="#8B96A8">authn / authz / audit</text>

    <line x1="355" y1="142" x2="355" y2="170" stroke="#4C566A"/>
    <line x1="355" y1="170" x2="180" y2="200" stroke="#4C566A" marker-end="url(#arrow)"/>
    <line x1="355" y1="170" x2="355" y2="200" stroke="#4C566A" marker-end="url(#arrow)"/>
    <line x1="355" y1="170" x2="530" y2="200" stroke="#4C566A" marker-end="url(#arrow)"/>

    <rect x="100" y="202" width="120" height="34" rx="6" fill="#161B22" stroke="#39D353"/>
    <text x="160" y="223">Tools</text>
    <rect x="295" y="202" width="120" height="34" rx="6" fill="#161B22" stroke="#39D353"/>
    <text x="355" y="223">Resources</text>
    <rect x="470" y="202" width="120" height="34" rx="6" fill="#161B22" stroke="#39D353"/>
    <text x="530" y="223">Prompts</text>

    <line x1="160" y1="236" x2="160" y2="264" stroke="#4C566A" marker-end="url(#arrow)"/>
    <line x1="355" y1="236" x2="355" y2="264" stroke="#4C566A" marker-end="url(#arrow)"/>
    <line x1="530" y1="236" x2="530" y2="264" stroke="#4C566A" marker-end="url(#arrow)"/>

    <rect x="140" y="266" width="450" height="36" rx="6" fill="#161B22" stroke="#22D3EE"/>
    <text x="365" y="289">Enterprise systems (internal APIs, databases, third-party servers)</text>

    <rect x="650" y="106" width="180" height="36" rx="6" fill="#161B22" stroke="#EF4444"/>
    <text x="740" y="129">Authorization</text>
    <line x1="650" y1="124" x2="432" y2="124" stroke="#EF4444" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="740" y="97" font-size="11" fill="#EF4444">enforced here, not in the model</text>
  </g>
  <text x="450" y="345" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#4C566A" text-anchor="middle" letter-spacing="1">MCP — CLIENT / GATEWAY / TOOL-RESOURCE-PROMPT PRIMITIVES</text>
