<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#0A0E14"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C566A"/>
    </marker>
  </defs>
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#C9D1D9" text-anchor="middle">
    <g id="node1">
      <rect x="370" y="20" width="160" height="36" rx="6" fill="#161B22" stroke="#22D3EE"/>
      <text x="450" y="43">Developer / kubectl</text>
    </g>
    <line x1="450" y1="56" x2="450" y2="84" stroke="#4C566A" marker-end="url(#arrow)"/>

    <g id="node2">
      <rect x="370" y="86" width="160" height="36" rx="6" fill="#161B22" stroke="#22D3EE"/>
      <text x="450" y="109">API Server</text>
    </g>
    <line x1="450" y1="122" x2="450" y2="150" stroke="#4C566A" marker-end="url(#arrow)"/>
    <line x1="450" y1="104" x2="240" y2="104" stroke="#4C566A"/>
    <line x1="240" y1="104" x2="240" y2="150" stroke="#4C566A" marker-end="url(#arrow)"/>

    <g id="node3">
      <rect x="160" y="152" width="160" height="36" rx="6" fill="#161B22" stroke="#7C3AED"/>
      <text x="240" y="175">etcd</text>
    </g>
    <g id="node4">
      <rect x="370" y="152" width="160" height="36" rx="6" fill="#161B22" stroke="#7C3AED"/>
      <text x="450" y="175">Scheduler /<tspan x="450" dy="14">Controller Manager</tspan></text>
    </g>
    <line x1="450" y1="188" x2="450" y2="216" stroke="#4C566A" marker-end="url(#arrow)"/>

    <g id="node5">
      <rect x="370" y="218" width="160" height="36" rx="6" fill="#161B22" stroke="#39D353"/>
      <text x="450" y="241">kubelet</text>
    </g>
    <line x1="450" y1="254" x2="450" y2="282" stroke="#4C566A" marker-end="url(#arrow)"/>

    <g id="node6">
      <rect x="370" y="284" width="160" height="36" rx="6" fill="#161B22" stroke="#39D353"/>
      <text x="450" y="307">Container Runtime (CRI)</text>
    </g>

    <g id="node7">
      <rect x="600" y="284" width="140" height="36" rx="6" fill="#161B22" stroke="#39D353"/>
      <text x="670" y="307">Pod</text>
    </g>
    <line x1="530" y1="302" x2="598" y2="302" stroke="#4C566A" marker-end="url(#arrow)"/>

    <g id="node8">
      <rect x="600" y="86" width="140" height="36" rx="6" fill="#161B22" stroke="#22D3EE"/>
      <text x="670" y="109">CoreDNS / kube-proxy</text>
    </g>
    <line x1="670" y1="122" x2="670" y2="282" stroke="#4C566A" stroke-dasharray="3,3"/>
    <text x="670" y="200" fill="#8B96A8" font-size="11">data plane</text>
  </g>
  <text x="450" y="345" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#4C566A" text-anchor="middle" letter-spacing="1">KUBERNETES — CONTROL PLANE (left) + DATA PLANE (right)</text>
</svg>
